<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Casa Bellissima - Under Construction</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0d2c20; 
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            padding: 20px;
        }
        .logo-box {
            background-color: #ffffff; 
            padding: 15px 25px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 35px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        img {
            max-width: 220px;
            height: auto;
            display: block;
        }
        h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        p {
            color: #d1e3db;
            font-size: 17px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-box">
            <img src="logo.jpg" alt="LaCasaBellissima Logo">
        </div>
        <h1>Unsere Website befindet sich aktuell im Aufbau</h1>
        <p>Wir arbeiten an unserem neuen Online-Auftritt. Wir sind bald für Sie da!</p>
    </div>
</body>
</html>

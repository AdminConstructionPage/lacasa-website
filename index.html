<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaCasaBellissima - Website im Aufbau</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #0f382b; /* Dunkelgrüner Hintergrund */
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 450px;
            width: 90%;
        }
        img {
            max-width: 220px;
            height: auto;
            margin-bottom: 25px;
        }
        h1 {
            color: #ffffff; /* Weißer Text */
            font-size: 22px;
            margin-bottom: 15px;
        }
        p {
            color: #e2e8f0; /* Hell-weißer/grauer Text für gute Lesbarkeit */
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="logo.jpg" alt="LaCasaBellissima Logo">
        <h1>Unsere Website befindet sich aktuell im Aufbau</h1>
        <p>Wir arbeiten an unserem neuen Online-Auftritt. Wir sind bald für Sie da!</p>
    </div>
</body>
</html>

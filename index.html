<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Casa Bellissima - Under Construction</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #2a3002; /* Olive Green */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 800px; /* تكبير عرض الحاوية */
            width: 100%;
            padding: 20px;
        }
        img {
            max-width: 420px; /* تكبير الشعار بشكل ملحوظ */
            width: 100%;
            height: auto;
            display: inline-block;
            margin-bottom: 40px;
        }
        h1 {
            color: #ffffff;
            font-size: 36px; /* تكبير حجم العنوان */
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.3;
        }
        p {
            color: #d1e3db;
            font-size: 20px; /* تكبير حجم النص */
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.jpg" alt="LaCasaBellissima Logo">
        <h1>Unsere Website befindet sich aktuell im Aufbau</h1>
        <p>Wir arbeiten an unserem neuen Online-Auftritt. Wir sind bald für Sie da!</p>
    </div>
</body>
</html>

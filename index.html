<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Casa Bellissima - Under Construction</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #716a5c; 
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 1000px; 
            width: 100%;
            padding: 20px;
        }
        img {
            max-width: 420px;
            width: 100%;
            height: auto;
            display: inline-block;
            margin-bottom: 40px;
        }
        h1 {
            color: #ffffff;
            font-size: 34px;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.3;
            white-space: nowrap; 
        }
        p {
            color: #ffffff;
            font-size: 20px;
            line-height: 1.6;
        }

        
        @media (max-width: 768px) {
            h1 {
                white-space: normal;
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.jpg" alt="LaCasaBellissima Logo">
        <h1>Unsere Website befindet sich aktuell im&nbsp;Aufbau</h1>
        <p>Wir arbeiten an unserem neuen Online-Auftritt. Wir sind bald für Sie da!</p>
    </div>
</body>
</html>
